# Builds, signs, notarizes, and publishes Parrot.app as a DMG whenever a
# v* tag is pushed, or on demand for an existing tag. install.sh and the
# README download releases/latest/download/Parrot.dmg.
#
# Repository secrets it needs, set once under Settings ▸ Secrets ▸ Actions:
#
#   MACOS_CERTIFICATE           Developer ID Application certificate and its
#                               private key, a .p12 export, base64-encoded
#                               (base64 -i cert.p12)
#   MACOS_CERTIFICATE_PASSWORD  the password given when exporting the .p12
#   NOTARY_KEY                  the Parrot-only App Store Connect API key
#                               (.p8), base64-encoded
#   NOTARY_KEY_ID               its Key ID
#   NOTARY_ISSUER_ID            the team's Issuer ID
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, such as v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build, sign, notarize, and publish Parrot.app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          [ -n "$MACOS_CERTIFICATE" ] || { echo "MACOS_CERTIFICATE secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          # The runner image lacks the Developer ID G2 intermediate, without
          # which the identity's chain is incomplete and it counts as invalid.
          curl -sSfo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "No valid Developer ID Application identity after import"; exit 1; }

      - name: build, sign, notarize, and package
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          [ -n "$NOTARY_KEY_BASE64" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] \
            || { echo "NOTARY_KEY, NOTARY_KEY_ID, and NOTARY_ISSUER_ID secrets must all be set"; exit 1; }
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          scripts/make-dmg.sh "${VERSION#v}"
          rm "$NOTARY_KEY"

      - name: verify
        run: |
          set -eu
          APP=build/Parrot.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv -t exec "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
          xcrun stapler validate "dist/Parrot-${VERSION#v}.dmg"

      - name: stable asset names
        run: |
          set -eu
          cd dist
          cp "Parrot-${VERSION#v}.dmg" Parrot.dmg
          shasum -a 256 Parrot.dmg > Parrot.dmg.sha256
          ls -lh

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Parrot ${{ env.VERSION }}
          files: |
            dist/Parrot-*.dmg
            dist/Parrot-*.dmg.sha256
            dist/Parrot.dmg
            dist/Parrot.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
